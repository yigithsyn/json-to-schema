name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        working-directory: build
        run: cpack --config CPackConfig.cmake -B packages
      - uses: actions/upload-artifact@v4
        with:
          name: json-to-schema-${{ matrix.os }}
          path: build/packages/json-to-schema-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extract release notes from changelog
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const cmake = fs.readFileSync('CMakeLists.txt', 'utf8');
            const project = cmake.match(/\bproject\s*\(\s*json_to_schema\b([^)]*)\)/i);
            const version = project?.[1].match(/\bVERSION\s+(\d+\.\d+\.\d+)\b/i)?.[1];
            if (!version || tag !== `v${version}`) {
              throw new Error(`Release tag ${tag} does not match json_to_schema version ${version || 'unknown'}`);
            }
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n').split('\n');
            const start = lines.findIndex(line =>
              line === `## [${tag}]` || line.startsWith(`## [${tag}] `));
            if (start === -1) {
              throw new Error(`Cannot find CHANGELOG.md entry for ${tag}`);
            }
            const end = lines.findIndex((line, index) => index > start && line.startsWith('## '));
            const notes = lines.slice(start, end === -1 ? undefined : end).join('\n').trim();
            if (!notes) {
              throw new Error(`CHANGELOG.md entry for ${tag} is empty`);
            }
            fs.writeFileSync('release-notes.md', `${notes}\n`);
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: packages/*
