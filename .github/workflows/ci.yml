name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            binary-path: build/ci/json-to-schema
            binary-name: json-to-schema-linux
          - os: macos-latest
            name: macos
            binary-path: build/ci/json-to-schema
            binary-name: json-to-schema-macos
          - os: windows-latest
            name: windows
            binary-path: build/ci/Release/json-to-schema.exe
            binary-name: json-to-schema-windows.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Run tests
        if: github.event_name != 'release'
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Stage release binary
        if: github.event_name == 'release'
        run: |
          cmake -E make_directory release-assets
          cmake -E copy "${{ matrix.binary-path }}" "release-assets/${{ matrix.binary-name }}"

      - name: Set up Emscripten
        if: github.event_name == 'release' && matrix.name == 'linux'
        uses: mymindstorm/setup-emsdk@v14

      - name: Build and test WASM distribution
        if: github.event_name == 'release' && matrix.name == 'linux'
        run: |
          emcc -O2 -std=c89 -Iinclude \
            src/jsmn.c src/json_schema.c \
            -o release-assets/json-to-schema-wasm.js \
            --no-entry \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_FUNCTIONS='["_jts_json_to_schema","_malloc","_free"]'
          node -e 'const wasm = require("./release-assets/json-to-schema-wasm.js"); if (typeof wasm._jts_json_to_schema !== "function") throw new Error("jts_json_to_schema was not exported");'

      - name: Upload release binary
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish release binaries
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
