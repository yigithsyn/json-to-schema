name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Run tests
        if: github.event_name != 'release'
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Package release
        if: github.event_name == 'release'
        run: cpack --config build/ci/CPackConfig.cmake -G ZIP -B build/ci

      - name: Upload release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: build/ci/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish release packages
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Upload package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
