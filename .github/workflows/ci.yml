name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build/ci -C Release --output-on-failure
