name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/ci --config Release --parallel

      - name: Run tests
        if: github.event_name != 'release'
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Package release
        if: github.event_name == 'release'
        run: cpack --config build/ci/CPackConfig.cmake -G ZIP -B build/ci

      - name: Upload release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: build/ci/*.zip
          if-no-files-found: error

  